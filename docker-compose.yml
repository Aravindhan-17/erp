version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: flasherp_postgres
    restart: always
    environment:
      POSTGRES_USER: flasherp_user
      POSTGRES_PASSWORD: flasherp_password
      POSTGRES_DB: flasherp_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flasherp_user -d flasherp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Engine (for Cart Reservations & WebSockets Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: flasherp_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. NestJS Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: flasherp_server
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://flasherp_user:flasherp_password@postgres:5432/flasherp_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: flasherp_client
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
